services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    # 55432 on the host: 5432 is commonly taken by a local Postgres or a tunnel.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  # auto-setup creates its own databases on the shared instance, so the stack
  # runs one Postgres rather than two.
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: booking
      POSTGRES_PWD: booking
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./ops/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://booking:booking@postgres:5432/booking?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://app:8080/mock-supplier
      CALLBACK_BASE_URL: http://app:8080
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-local-only-not-a-secret}
      SWAGGER_ENABLED: "true"
      SUPPLIER_MOCK_ENABLED: "true"
      # The demo deadline is short so the timeout scenario is observable. The
      # hold must exceed it or the call simply succeeds and nothing times out.
      SUPPLIER_DEADLINE: 8s
      MOCK_TIMEOUT_HOLD: 25s
      MOCK_CALLBACK_DELAY: 12s
    ports:
      - "8080:8080"

volumes:
  pgdata:
